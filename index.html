<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Veszprém Időjárás</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(155deg, #0d2137 0%, #183a5e 50%, #244f7a 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 38px;
            overflow: hidden;
            position: relative;
        }

        /* Nappali és esti témák (05:30 - 22:00) */
        body.theme-day-clear {
            background: linear-gradient(155deg, #103c70 0%, #235c9c 55%, #3779c2 100%);
        }
        body.theme-day-cloudy {
            background: linear-gradient(155deg, #2b3847 0%, #435469 100%);
        }
        body.theme-day-rain {
            background: linear-gradient(155deg, #161f2b 0%, #29384a 100%);
        }
        body.theme-evening {
            background: linear-gradient(155deg, #070e1c 0%, #101f3b 100%);
        }

        .content-layer {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Felső szekció */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .clock-box {
            text-align: left;
        }
        #clock {
            font-size: 120px;
            font-weight: 200;
            line-height: 0.95;
            letter-spacing: -3px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        }
        #night-summary {
            display: none;
        }
        #date {
            font-size: 25px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 10px;
            text-transform: capitalize;
        }
        .location-tag {
            display: block;
            margin-top: 6px;
            font-size: 16px;
            color: #8cc4ff;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .current-weather {
            display: flex;
            align-items: center;
            text-align: right;
        }
        .weather-details {
            margin-right: 22px;
        }
        #weather-desc {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .sub-details {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.45;
        }
        .main-icon-wrap {
            width: 112px;
            height: 112px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .temp-main {
            font-size: 120px;
            font-weight: 200;
            line-height: 0.95;
            margin-left: 14px;
            letter-spacing: -3px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        }

        /* Kártyák */
        .glass-card {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
        }

        /* Óránkénti előrejelzés */
        .hourly-section {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
        }
        .hour-card {
            width: 15.2%;
            padding: 16px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .hour-time {
            font-size: 19px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.78);
        }
        .hour-icon-wrap {
            width: 52px;
            height: 52px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hour-temp {
            font-size: 26px;
            font-weight: 500;
        }

        /* 4 napos előrejelzés Apple hőmérséklet-sávval */
        .daily-section {
            display: flex;
            justify-content: space-between;
            padding-top: 4px;
        }
        .day-card {
            width: 23.6%;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .day-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .day-name {
            font-size: 21px;
            font-weight: 500;
            text-transform: capitalize;
        }
        .day-icon-wrap {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .day-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .temp-min {
            font-size: 19px;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
            width: 36px;
        }
        .temp-max {
            font-size: 19px;
            font-weight: 600;
            width: 36px;
            text-align: right;
        }
        .temp-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin: 0 10px;
            position: relative;
            overflow: hidden;
        }
        .temp-bar-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 4px;
            background: linear-gradient(90deg, #5ac8fa 0%, #ffcc00 65%, #ff9500 100%);
        }

        #status-bar {
            position: absolute;
            bottom: 6px;
            right: 38px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* =========================================================
           ÉJSZAKAI ÜZEMMÓD (22:00 - 05:30):
           Óriási, vastag (bold) középszürke óra + alatta rövid időjárás
           ========================================================= */
        body.theme-night-clock {
            background: #000000 !important;
            padding: 0;
            justify-content: center;
            align-items: center;
        }
        body.theme-night-clock .content-layer {
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        body.theme-night-clock .top-section {
            border-bottom: none;
            padding-bottom: 0;
            justify-content: center;
            width: 100%;
        }
        body.theme-night-clock .clock-box {
            text-align: center;
            width: 100%;
        }
        body.theme-night-clock #clock {
            font-size: 315px;
            font-weight: 700;
            color: #52575e; /* Jól olvasható, szemkímélő középszürke */
            text-shadow: none;
            letter-spacing: -8px;
            line-height: 0.95;
        }
        body.theme-night-clock #night-summary {
            display: block;
            margin-top: 28px;
            font-size: 56px;
            font-weight: 600;
            color: #454a50;
            letter-spacing: -0.5px;
        }
        body.theme-night-clock #date,
        body.theme-night-clock .location-tag,
        body.theme-night-clock .current-weather,
        body.theme-night-clock .hourly-section,
        body.theme-night-clock .daily-section,
        body.theme-night-clock #status-bar {
            display: none !important;
        }
    </style>
</head>
<body class="theme-evening">

    <div class="content-layer">
        <div class="top-section">
            <div class="clock-box">
                <div id="clock">00:00</div>
                <div id="night-summary">--° • Betöltés</div>
                <div id="date">Betöltés...</div>
                <div class="location-tag">📍 Veszprém, Csalogány utca</div>
            </div>
            <div class="current-weather">
                <div class="weather-details">
                    <div id="weather-desc">--</div>
                    <div class="sub-details">
                        Hőérzet: <span id="apparent-temp">--</span>° • Páratartalom: <span id="humidity">--</span>%<br>
                        Szél: <span id="wind-speed">--</span> km/h • Ma: <span id="today-min">--</span>° / <span id="today-max">--</span>°
                    </div>
                </div>
                <div class="main-icon-wrap" id="main-icon"></div>
                <div class="temp-main"><span id="current-temp">--</span>°</div>
            </div>
        </div>

        <div class="hourly-section" id="hourly-container"></div>

        <div class="daily-section" id="daily-container"></div>
    </div>

    <div id="status-bar">Frissítés...</div>

    <script>
        var LAT = 47.0985;
        var LON = 17.9150;
        var latestWeatherData = null;
        var lastMinuteStr = "";

        var daysHu = ["Vasárnap", "Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek", "Szombat"];
        var monthsHu = ["január", "február", "március", "április", "május", "június", "július", "augusztus", "szeptember", "október", "november", "december"];

        // Statikus, animációmentes Apple-stílusú SVG ikonok
        function getSvgIcon(code, isDay) {
            var uid = Math.floor(Math.random() * 100000);

            var sunSvg = '<g>' +
                '<circle cx="50" cy="50" r="22" fill="url(#sunGrad' + uid + ')"/>' +
                '<g stroke="#FFD60A" stroke-width="4" stroke-linecap="round">' +
                '<line x1="50" y1="14" x2="50" y2="21"/><line x1="50" y1="79" x2="50" y2="86"/>' +
                '<line x1="14" y1="50" x2="21" y2="50"/><line x1="79" y1="50" x2="86" y2="50"/>' +
                '<line x1="24.5" y1="24.5" x2="29.5" y2="29.5"/><line x1="70.5" y1="70.5" x2="75.5" y2="75.5"/>' +
                '<line x1="75.5" y1="24.5" x2="70.5" y2="29.5"/><line x1="29.5" y1="70.5" x2="24.5" y2="75.5"/>' +
                '</g></g>';

            var moonSvg = '<g>' +
                '<path d="M62 24 A26 26 0 1 0 78 66 A21 21 0 1 1 62 24 Z" fill="url(#moonGrad' + uid + ')"/>' +
                '<circle cx="72" cy="28" r="2.2" fill="#FFF9D6" opacity="0.9"/>' +
                '<circle cx="80" cy="42" r="1.5" fill="#FFF9D6" opacity="0.7"/>' +
                '</g>';

            var cloudSvg = '<g>' +
                '<path d="M30 72 H72 A15 15 0 0 0 70 42 A22 22 0 0 0 28 38 A17 17 0 0 0 30 72 Z" fill="url(#cloudGrad' + uid + ')"/>' +
                '</g>';

            var smallSun = '<circle cx="36" cy="38" r="16" fill="url(#sunGrad' + uid + ')"/>';
            var smallMoon = '<path d="M40 20 A16 16 0 1 0 52 46 A13 13 0 1 1 40 20 Z" fill="url(#moonGrad' + uid + ')"/>';

            var rainDrops = '<g stroke="#5AC8FA" stroke-width="3.5" stroke-linecap="round">' +
                '<line x1="36" y1="77" x2="32" y2="88"/>' +
                '<line x1="50" y1="77" x2="46" y2="88"/>' +
                '<line x1="64" y1="77" x2="60" y2="88"/>' +
                '</g>';

            var snowFlakes = '<g fill="#FFFFFF">' +
                '<circle cx="36" cy="82" r="3"/><circle cx="50" cy="85" r="3"/><circle cx="64" cy="82" r="3"/>' +
                '</g>';

            var bolt = '<polygon points="52,66 42,81 50,81 46,94 60,77 51,77" fill="#FFD60A"/>';

            var defs = '<defs>' +
                '<linearGradient id="sunGrad' + uid + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
                '<stop offset="0%" stop-color="#FFE600"/><stop offset="100%" stop-color="#FF9500"/></linearGradient>' +
                '<linearGradient id="moonGrad' + uid + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
                '<stop offset="0%" stop-color="#FFFDF0"/><stop offset="100%" stop-color="#C9D6EA"/></linearGradient>' +
                '<linearGradient id="cloudGrad' + uid + '" x1="0%" y1="0%" x2="0%" y2="100%">' +
                '<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>' +
                '<stop offset="100%" stop-color="#D0DCE8" stop-opacity="0.88"/></linearGradient>' +
                '</defs>';

            var bodySvg = "";
            if (code === 0) {
                bodySvg = isDay ? sunSvg : moonSvg;
            } else if (code === 1 || code === 2) {
                bodySvg = (isDay ? smallSun : smallMoon) + cloudSvg;
            } else if (code === 3 || code === 45 || code === 48) {
                bodySvg = cloudSvg;
            } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                bodySvg = cloudSvg + rainDrops;
            } else if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
                bodySvg = cloudSvg + snowFlakes;
            } else if (code >= 95) {
                bodySvg = cloudSvg + bolt;
            } else {
                bodySvg = isDay ? sunSvg : moonSvg;
            }

            return '<svg viewBox="0 0 100 100" width="100%" height="100%">' + defs + bodySvg + '</svg>';
        }

        function getWeatherMeta(code) {
            var map = {
                0: { text: "Derült", shortText: "Tiszta", effect: "clear" },
                1: { text: "Többnyire derült", shortText: "Tiszta", effect: "clear" },
                2: { text: "Részben felhős", shortText: "Felhős", effect: "clouds" },
                3: { text: "Borult", shortText: "Borult", effect: "clouds" },
                45: { text: "Ködös", shortText: "Köd", effect: "clouds" },
                48: { text: "Zúzmarás köd", shortText: "Köd", effect: "clouds" },
                51: { text: "Gyenge szitálás", shortText: "Szitálás", effect: "rain" },
                53: { text: "Szitálás", shortText: "Szitálás", effect: "rain" },
                55: { text: "Erős szitálás", shortText: "Szitálás", effect: "rain" },
                61: { text: "Gyenge eső", shortText: "Eső", effect: "rain" },
                63: { text: "Eső", shortText: "Eső", effect: "rain" },
                65: { text: "Heves eső", shortText: "Eső", effect: "rain" },
                66: { text: "Ónos eső", shortText: "Ónos eső", effect: "rain" },
                67: { text: "Erős ónos eső", shortText: "Ónos eső", effect: "rain" },
                71: { text: "Gyenge havazás", shortText: "Hó", effect: "snow" },
                73: { text: "Havazás", shortText: "Hó", effect: "snow" },
                75: { text: "Erős havazás", shortText: "Hó", effect: "snow" },
                77: { text: "Hószállingózás", shortText: "Hó", effect: "snow" },
                80: { text: "Zápor", shortText: "Zápor", effect: "rain" },
                81: { text: "Erős zápor", shortText: "Zápor", effect: "rain" },
                82: { text: "Felhőszakadás", shortText: "Eső", effect: "rain" },
                85: { text: "Hózápor", shortText: "Hózápor", effect: "snow" },
                86: { text: "Erős hózápor", shortText: "Hózápor", effect: "snow" },
                95: { text: "Zivatar", shortText: "Zivatar", effect: "rain" },
                96: { text: "Zivatar jégesővel", shortText: "Zivatar", effect: "rain" },
                99: { text: "Heves zivatar", shortText: "Zivatar", effect: "rain" }
            };
            return map[code] || { text: "Változó", shortText: "Változó", effect: "clouds" };
        }

        function applyThemeAndTime() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();

            var hours = String(h);
            var minutes = String(m);
            if (hours.length < 2) hours = "0" + hours;
            if (minutes.length < 2) minutes = "0" + minutes;

            var currentMinuteStr = hours + ":" + minutes;
            if (currentMinuteStr !== lastMinuteStr) {
                lastMinuteStr = currentMinuteStr;
                document.getElementById("clock").innerText = currentMinuteStr;
                document.getElementById("date").innerText = daysHu[now.getDay()] + ", " + monthsHu[now.getMonth()] + " " + now.getDate() + ".";

                // 22:00 és 05:30 között csak a vastag középszürke óra és a rövid időjárás látszik
                var totalMinutes = h * 60 + m;
                var isNightClock = (totalMinutes >= 22 * 60 || totalMinutes < 5 * 60 + 30);

                if (isNightClock) {
                    document.body.className = "theme-night-clock";
                } else if (latestWeatherData) {
                    var curr = latestWeatherData.current;
                    var meta = getWeatherMeta(curr.weather_code);
                    if (curr.is_day === 0) {
                        document.body.className = "theme-evening";
                    } else if (meta.effect === "rain") {
                        document.body.className = "theme-day-rain";
                    } else if (meta.effect === "clouds") {
                        document.body.className = "theme-day-cloudy";
                    } else {
                        document.body.className = "theme-day-clear";
                    }
                } else {
                    document.body.className = "theme-evening";
                }
            }
        }

        function fetchWeather() {
            var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
                      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
                      "&hourly=temperature_2m,weather_code,is_day" +
                      "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
                      "&timezone=Europe%2FBudapest&forecast_days=5";

            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    latestWeatherData = JSON.parse(xhr.responseText);
                    renderWeather(latestWeatherData);
                }
            };
            xhr.send();
        }

        function renderWeather(data) {
            var curr = data.current;
            var meta = getWeatherMeta(curr.weather_code);
            var isDayNow = (curr.is_day === 1);
            var roundedTemp = Math.round(curr.temperature_2m);

            document.getElementById("current-temp").innerText = roundedTemp;
            document.getElementById("night-summary").innerText = roundedTemp + "° • " + meta.shortText;
            document.getElementById("apparent-temp").innerText = Math.round(curr.apparent_temperature);
            document.getElementById("humidity").innerText = Math.round(curr.relative_humidity_2m);
            document.getElementById("wind-speed").innerText = Math.round(curr.wind_speed_10m);
            document.getElementById("weather-desc").innerText = meta.text;
            document.getElementById("today-min").innerText = Math.round(data.daily.temperature_2m_min[0]);
            document.getElementById("today-max").innerText = Math.round(data.daily.temperature_2m_max[0]);

            document.getElementById("main-icon").innerHTML = getSvgIcon(curr.weather_code, isDayNow);

            lastMinuteStr = "";
            applyThemeAndTime();

            // Óránkénti előrejelzés
            var hourlyHtml = "";
            var count = 0;
            for (var i = 0; i < data.hourly.time.length; i++) {
                var itemDate = new Date(data.hourly.time[i]);
                if (itemDate.getTime() > new Date().getTime() && count < 6) {
                    if (i % 2 === 0) {
                        var h = String(itemDate.getHours());
                        if (h.length < 2) h = "0" + h;
                        var hIsDay = (data.hourly.is_day[i] === 1);
                        var hSvg = getSvgIcon(data.hourly.weather_code[i], hIsDay);
                        var hTemp = Math.round(data.hourly.temperature_2m[i]);

                        hourlyHtml += '<div class="glass-card hour-card">' +
                                      '<div class="hour-time">' + h + ':00</div>' +
                                      '<div class="hour-icon-wrap">' + hSvg + '</div>' +
                                      '<div class="hour-temp">' + hTemp + '°</div>' +
                                      '</div>';
                        count++;
                    }
                }
            }
            document.getElementById("hourly-container").innerHTML = hourlyHtml;

            // 4 napos előrejelzés
            var weekMin = 100;
            var weekMax = -100;
            for (var k = 1; k <= 4; k++) {
                if (data.daily.temperature_2m_min[k] < weekMin) weekMin = data.daily.temperature_2m_min[k];
                if (data.daily.temperature_2m_max[k] > weekMax) weekMax = data.daily.temperature_2m_max[k];
            }
            var range = Math.max(weekMax - weekMin, 1);

            var dailyHtml = "";
            for (var d = 1; d <= 4; d++) {
                var dDate = new Date(data.daily.time[d]);
                var dName = daysHu[dDate.getDay()];
                var dSvg = getSvgIcon(data.daily.weather_code[d], true);
                var tMax = Math.round(data.daily.temperature_2m_max[d]);
                var tMin = Math.round(data.daily.temperature_2m_min[d]);

                var leftPct = Math.round(((data.daily.temperature_2m_min[d] - weekMin) / range) * 100);
                var widthPct = Math.max(Math.round(((data.daily.temperature_2m_max[d] - data.daily.temperature_2m_min[d]) / range) * 100), 15);

                dailyHtml += '<div class="glass-card day-card">' +
                             '<div class="day-top">' +
                                 '<div class="day-name">' + dName + '</div>' +
                                 '<div class="day-icon-wrap">' + dSvg + '</div>' +
                             '</div>' +
                             '<div class="day-bottom">' +
                                 '<span class="temp-min">' + tMin + '°</span>' +
                                 '<div class="temp-bar-bg"><div class="temp-bar-fill" style="left:' + leftPct + '%; width:' + widthPct + '%;"></div></div>' +
                                 '<span class="temp-max">' + tMax + '°</span>' +
                             '</div>' +
                             '</div>';
            }
            document.getElementById("daily-container").innerHTML = dailyHtml;

            var now = new Date();
            var uH = String(now.getHours());
            var uM = String(now.getMinutes());
            if (uH.length < 2) uH = "0" + uH;
            if (uM.length < 2) uM = "0" + uM;
            document.getElementById("status-bar").innerText = "Frissítve: " + uH + ":" + uM;
        }

        // Indítás
        applyThemeAndTime();
        fetchWeather();
        setInterval(applyThemeAndTime, 10000);
        setInterval(fetchWeather, 15 * 60 * 1000);
    </script>
</body>
</html>
